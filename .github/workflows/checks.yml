name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv run --locked --group dev pytest -q
      - name: End-to-end on small synthetic data
        run: |
          uv run --locked python vss.py prepare --source synthetic --n 3000 --dim 64
          uv run --locked python vss.py run --scales 1000 3000 --runs 1
          uv run --locked python vss.py report
